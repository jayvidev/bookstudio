services:

  postgres:
    image: postgres:18-alpine
    container_name: bookstudio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstudio
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (data lives in a versioned subdirectory)
      - postgres_data:/var/lib/postgresql
    # Not published to the host; docker-compose.override.yml does it for dev.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d bookstudio"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bookstudio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstudio
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"
    # Health is reported by the image's HEALTHCHECK (/actuator/health/readiness).

volumes:
  postgres_data:
