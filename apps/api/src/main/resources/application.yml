# Shared configuration. In docker/prod the datasource comes from the
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables.
spring:
  application:
    name: bookstudio
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    error:
      whitelabel:
        enabled: false
  servlet:
    multipart:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      # No default: every environment must provide APP_SECURITY_JWT_SECRET
      # (at least 32 bytes). The app refuses to start without it.
      issuer: bookstudio-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    auth-rate-limit:
      # Per client IP, on /auth/login, /auth/demo and /auth/refresh
      requests-per-minute: 10
