server:
  # Behind the hosting provider's proxy: trust X-Forwarded-* from it so the
  # client IP (used for rate limiting) is the real one.
  forward-headers-strategy: native

spring:
  flyway:
    # Schema migrations only; never the demo seed
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: https://bookstudio-site.vercel.app

springdoc:
  api-docs:
    enabled: false
